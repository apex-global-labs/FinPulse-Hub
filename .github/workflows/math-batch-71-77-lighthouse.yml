name: Math Batch 71-77 Mobile Lighthouse
on:
  push:
    branches: [feat/seven-language-translation-engine-phase-1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-math-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and Lighthouse
        run: |
          npm install --no-save playwright@1.56.1 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/finpulse-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/finpulse-server.log
          exit 1
      - name: Verify all seven Math routes render before auditing
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const routes = [
            ['linear-equation', 'Linear Equation Solver'],
            ['quadratic-equation', 'Quadratic Equation Solver'],
            ['simultaneous-equations', 'Simultaneous Equations Solver'],
            ['polynomial-calculator', 'Polynomial Calculator'],
            ['logarithm', 'Logarithm Calculator'],
            ['matrix-operations', 'Matrix Operations Calculator'],
            ['matrix-determinant', 'Matrix Determinant Calculator']
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            try {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              for (const [id, expectedTitle] of routes) {
                const response = await page.goto('http://127.0.0.1:4173/?tool=' + id, { waitUntil: 'domcontentloaded' });
                if (!response || !response.ok()) throw new Error(id + ': route response was not successful');
                await page.locator('#app .heading h2').waitFor({ state: 'visible', timeout: 15000 });
                const actualTitle = (await page.locator('#app .heading h2').innerText()).trim();
                if (actualTitle !== expectedTitle) throw new Error(id + ': expected "' + expectedTitle + '", got "' + actualTitle + '"');
                await page.locator('#form').waitFor({ state: 'visible', timeout: 5000 });
                console.log('PASS ' + id);
              }
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Run mobile Lighthouse for Math tools 71-77
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lighthouse-math-71-77
          CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          routes=(linear-equation quadratic-equation simultaneous-equations polynomial-calculator logarithm matrix-operations matrix-determinant)
          for route in "${routes[@]}"; do
            echo "Auditing $route"
            npx lighthouse "http://127.0.0.1:4173/?tool=$route" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,seo \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=390 \
              --screenEmulation.height=844 \
              --screenEmulation.deviceScaleFactor=1 \
              --throttling-method=simulate \
              --output=json \
              --output-path="artifacts/lighthouse-math-71-77/$route.json" \
              --quiet
          done
      - name: Summarize LCP and CLS
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'artifacts/lighthouse-math-71-77';
          const files = fs.readdirSync(path).filter(x => x.endsWith('.json'));
          const rows = files.map(file => {
            const report = JSON.parse(fs.readFileSync(path + '/' + file, 'utf8'));
            const a = report.audits;
            const lcpItems = a['largest-contentful-paint-element']?.details?.items || [];
            const lcpNode = lcpItems[0]?.items?.[0]?.node || lcpItems[0]?.node || null;
            const network = a['network-requests']?.details?.items || [];
            const toolContentRequested = network.some(item => item.url.includes('/translations/tool-content.json'));
            const directoryMappingRequested = network.some(item => item.url.includes('/tool-category-mapping.json'));
            return {
              route: file.replace('.json', ''),
              performance: Math.round(report.categories.performance.score * 100),
              accessibility: Math.round(report.categories.accessibility.score * 100),
              seo: Math.round(report.categories.seo.score * 100),
              lcp_ms: a['largest-contentful-paint']?.numericValue ?? null,
              cls: a['cumulative-layout-shift']?.numericValue ?? null,
              tbt_ms: a['total-blocking-time']?.numericValue ?? null,
              lcp_element: lcpNode?.nodeLabel || lcpNode?.snippet || '',
              lcp_selector: lcpNode?.selector || '',
              lcp_phases: lcpItems[1]?.items || [],
              script_count: network.filter(item => item.resourceType === 'Script').length,
              tool_content_requested: toolContentRequested,
              directory_mapping_requested: directoryMappingRequested
            };
          });
          fs.writeFileSync(path + '/summary.json', JSON.stringify(rows, null, 2));
          console.log(JSON.stringify(rows, null, 2));
          if (rows.length !== 7) {
            console.error('Expected 7 route reports; received ' + rows.length);
            process.exitCode = 1;
          }
          if (rows.some(row => row.tool_content_requested || row.directory_mapping_requested)) {
            console.error('Math routes must not download draft tool-content or the full directory mapping');
            process.exitCode = 1;
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile-math-71-77
          path: artifacts/lighthouse-math-71-77/
          if-no-files-found: warn
          retention-days: 14
