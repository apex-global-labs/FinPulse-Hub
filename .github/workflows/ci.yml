name: Finance Calculator CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Verify live Frankfurter reference-rate API
        run: npm run test:api
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install chromium
      - name: Desktop and mobile browser tests
        run: npm run test:browser
      - name: Upload static SEO prerender pilot pages
        uses: actions/upload-artifact@v4
        with:
          name: finpulse-static-seo-prerender-pilot
          path: .prerender-pilot/**
          if-no-files-found: error
          retention-days: 14
